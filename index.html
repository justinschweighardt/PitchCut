<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PitchCut</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; margin: 0; background: #0f1720; color: #e8eef5; }
  header { padding: 14px 18px; background: #16212e; font-size: 22px; font-weight: 700; }
  header span { color: #4cc2ff; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
  .card { background: #16212e; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  button { background: #4cc2ff; color: #06202e; border: 0; border-radius: 8px; padding: 12px 16px;
           font-size: 16px; font-weight: 600; margin: 4px; cursor: pointer; }
  button.alt { background: #2a3b4e; color: #e8eef5; }
  button.active { outline: 3px solid #fff; }
  video { width: 100%; border-radius: 8px; background: #000; }
  canvas { max-width: 100%; border-radius: 8px; touch-action: none; }
  .hidden { display: none; }
  label { display: block; margin-top: 10px; }
  input[type=range] { width: 100%; }
  progress { width: 100%; height: 18px; }
</style>
</head>
<body>
<header>Pitch<span>Cut</span></header>
<div class="wrap">

  <div class="card">
    <h3>1. Choose your video</h3>
    <input type="file" id="file" accept="video/*">
  </div>

  <div class="card hidden" id="step2">
    <h3>2. Drag a box around the pitcher</h3>
    <canvas id="cv"></canvas>
    <label>Sensitivity (more sensitive catches more, including extras)
      <input type="range" id="sens" min="1" max="10" value="7">
    </label>
    <button onclick="findPitches()">Find pitches</button>
    <progress id="prog" value="0" max="1" class="hidden"></progress>
    <div id="msg"></div>
  </div>

  <div class="card hidden" id="step3">
    <h3>3. Review pitches</h3>
    <video id="player" controls playsinline muted></video>
    <div>
      <strong>Speed:</strong>
      <button class="alt spd" data-s="1">1x</button>
      <button class="alt spd" data-s="0.5">0.5x</button>
      <button class="alt spd" data-s="0.25">0.25x</button>
      <button class="alt spd" data-s="0.125">0.125x</button>
    </div>
    <div>
      <button class="alt" onclick="stepFrame(-1)">&laquo; Frame</button>
      <button class="alt" onclick="skip(-1)">Back 1s</button>
      <button onclick="togglePlay()">Play / Pause</button>
      <button class="alt" onclick="skip(1)">Forward 1s</button>
      <button class="alt" onclick="stepFrame(1)">Frame &raquo;</button>
    </div>
    <div>
      <button class="alt" onclick="gotoClip(cur - 1)">Previous pitch</button>
      <button class="alt" id="loopBtn" onclick="toggleLoop()">Loop: off</button>
      <button class="alt" id="reelBtn" onclick="toggleReel()">Play all: off</button>
      <button class="alt" onclick="gotoClip(cur + 1)">Next pitch</button>
    </div>
    <h4 id="count">All pitches</h4>
    <div id="clipList"></div>
  </div>
</div>

<script>
const PRE = 2.0, POST = 1.0, MERGE_GAP = 4.0, FPS = 30;
const fileInput = document.getElementById('file');
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const player = document.getElementById('player');
let url = null, box = null, dragStart = null, scale = 1;
let clips = [], cur = 0, loop = false, reel = false;

fileInput.onchange = () => {
  const f = fileInput.files[0]; if (!f) return;
  url = URL.createObjectURL(f);
  const v = document.createElement('video');
  v.muted = true; v.src = url;
  v.onloadeddata = () => { v.currentTime = 0.1; };
  v.onseeked = () => {
    cv.width = v.videoWidth; cv.height = v.videoHeight;
    ctx.drawImage(v, 0, 0);
    window.firstFrame = ctx.getImageData(0, 0, cv.width, cv.height);
    document.getElementById('step2').classList.remove('hidden');
  };
};

function redraw() {
  ctx.putImageData(window.firstFrame, 0, 0);
  if (box) { ctx.strokeStyle = '#4cc2ff'; ctx.lineWidth = Math.max(3, cv.width / 300); ctx.strokeRect(...box); }
}
function pos(e) {
  const r = cv.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e;
  return [(t.clientX - r.left) * cv.width / r.width, (t.clientY - r.top) * cv.height / r.height];
}
function down(e) { e.preventDefault(); dragStart = pos(e); }
function move(e) {
  if (!dragStart) return; e.preventDefault();
  const p = pos(e);
  box = [Math.min(dragStart[0], p[0]), Math.min(dragStart[1], p[1]),
         Math.abs(p[0] - dragStart[0]), Math.abs(p[1] - dragStart[1])];
  redraw();
}
function up() { dragStart = null; }
['mousedown','touchstart'].forEach(n => cv.addEventListener(n, down, { passive: false }));
['mousemove','touchmove'].forEach(n => cv.addEventListener(n, move, { passive: false }));
['mouseup','touchend','mouseleave'].forEach(n => cv.addEventListener(n, up));

function seek(v, t) {
  return new Promise(res => { v.onseeked = () => res(); v.currentTime = t; });
}

async function findPitches() {
  if (!box || box[2] < 10) { alert('Drag a box around the pitcher first.'); return; }
  const sens = parseInt(document.getElementById('sens').value);
  const threshold = 0.09 - sens * 0.008;   // fraction of changed pixels in the box
  const minRun = 2;                         // samples in a row above threshold
  const STEP = 1 / 10;                      // sample 10 times per second

  const v = document.createElement('video');
  v.muted = true; v.src = url;
  await new Promise(r => v.onloadeddata = r);
  const dur = v.duration;
  const [bx, by, bw, bh] = box.map(Math.round);
  const W = 160, H = Math.max(1, Math.round(160 * bh / bw));
  const small = document.createElement('canvas'); small.width = W; small.height = H;
  const sctx = small.getContext('2d', { willReadFrequently: true });

  const prog = document.getElementById('prog'); prog.classList.remove('hidden'); prog.max = dur;
  const hits = []; let prev = null, run = 0;
  for (let t = 0; t < dur; t += STEP) {
    await seek(v, t);
    sctx.drawImage(v, bx, by, bw, bh, 0, 0, W, H);
    const d = sctx.getImageData(0, 0, W, H).data;
    const gray = new Uint8Array(W * H);
    for (let i = 0; i < gray.length; i++) gray[i] = (d[i*4] + d[i*4+1] + d[i*4+2]) / 3;
    if (prev) {
      let changed = 0;
      for (let i = 0; i < gray.length; i++) if (Math.abs(gray[i] - prev[i]) > 25) changed++;
      if (changed / gray.length > threshold) { run++; if (run === minRun) hits.push(t); } else run = 0;
    }
    prev = gray;
    prog.value = t;
    document.getElementById('msg').textContent = `Scanning... ${Math.round(t / dur * 100)}%`;
  }

  // group nearby hits, pad, and merge overlapping ranges
  const groups = [];
  hits.forEach(t => {
    if (groups.length && t - groups[groups.length - 1].slice(-1)[0] <= MERGE_GAP) groups[groups.length - 1].push(t);
    else groups.push([t]);
  });
  clips = [];
  groups.forEach(g => {
    const s = Math.max(0, g[0] - PRE), e = Math.min(dur, g[g.length - 1] + POST);
    if (clips.length && s <= clips[clips.length - 1].end) clips[clips.length - 1].end = Math.max(clips[clips.length - 1].end, e);
    else clips.push({ start: s, end: e });
  });

  document.getElementById('msg').textContent = `Done. Found ${clips.length} pitches.`;
  prog.classList.add('hidden');
  showClips();
}

function showClips() {
  document.getElementById('step3').classList.remove('hidden');
  document.getElementById('count').textContent = `${clips.length} pitches found`;
  const list = document.getElementById('clipList'); list.innerHTML = '';
  clips.forEach((c, i) => {
    const b = document.createElement('button'); b.className = 'alt';
    b.textContent = `Pitch ${i + 1}  (at ${c.start.toFixed(1)}s)`;
    b.onclick = () => gotoClip(i); list.appendChild(b);
  });
  player.src = url;
  player.onloadeddata = () => gotoClip(0);
}
function gotoClip(i) {
  if (!clips.length) return;
  cur = (i + clips.length) % clips.length;
  player.currentTime = clips[cur].start;
  player.play();
}
player.addEventListener('timeupdate', () => {
  if (!clips.length) return;
  const c = clips[cur];
  if (player.currentTime >= c.end) {
    if (loop) player.currentTime = c.start;
    else if (reel) gotoClip(cur + 1);
    else player.pause();
  }
});
document.querySelectorAll('.spd').forEach(b => b.onclick = () => {
  player.playbackRate = parseFloat(b.dataset.s);
  document.querySelectorAll('.spd').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
});
function togglePlay() { player.paused ? player.play() : player.pause(); }
function skip(s) { player.currentTime = Math.max(0, player.currentTime + s); }
function stepFrame(d) { player.pause(); player.currentTime = Math.max(0, player.currentTime + d / FPS); }
function toggleLoop() { loop = !loop; document.getElementById('loopBtn').textContent = 'Loop: ' + (loop ? 'on' : 'off'); }
function toggleReel() { reel = !reel; document.getElementById('reelBtn').textContent = 'Play all: ' + (reel ? 'on' : 'off'); }
</script>
</body>
</html>
